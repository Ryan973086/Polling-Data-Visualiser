name: Build and Deploy Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run ETL to refresh polling data
        run: python "etl/Polling Dashboard Source Data ETL Script.py"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Evidence/package-lock.json

      - name: Install Evidence dependencies
        working-directory: Evidence
        run: npm ci

      - name: Build Evidence sources
        working-directory: Evidence
        run: npm run sources

      - name: Build Evidence site
        working-directory: Evidence
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Evidence/build/Polling-Data-Visualiser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
